name: CI

# Roda em toda PR (e push direto na main, só como segurança extra)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Testes, TypeScript e Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências (exatamente do package-lock.json)
        run: npm ci

      - name: Rodar ESLint
        run: npm run lint

      - name: Checar erros de TypeScript
        run: npx tsc --noEmit

      - name: Build (compilar TypeScript -> dist/)
        run: npm run build

      # Falha o CI se a cobertura cair abaixo do limite definido em
      # jest.config.js (coverageThreshold) — hoje calibrado pra cobertura
      # atual do projeto, sobe aos poucos até 80%+ (diferencial do documento).
      - name: Rodar testes Jest com cobertura
        run: npm run test:coverage

      - name: Upload do relatório de cobertura (artefato do workflow)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
