name: CI

# Roda em toda PR (e push direto na main, só como segurança extra)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Testes, TypeScript e Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências (exatamente do package-lock.json)
        run: npm ci

      - name: Checar erros de TypeScript
        run: npx tsc --noEmit

      - name: Rodar testes Jest com cobertura
        run: npx jest --coverage

      # Falha o CI se a cobertura cair abaixo do limite definido.
      # Ajusta os números no jest.config.js (coverageThreshold) se quiser
      # usar isso pra travar o diferencial de 80%+ coverage.
      - name: Upload do relatório de cobertura (artefato do workflow)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7